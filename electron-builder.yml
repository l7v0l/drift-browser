appId: com.l7v0l.drift
productName: Drift
copyright: Copyright (c) 2026 l7v0l
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Drift
  artifactName: Drift-Setup-${version}.${ext}
portable:
  artifactName: Drift-${version}-portable.${ext}

mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target: [dmg]

# Updates come from GitHub Releases (electron-updater reads latest.yml published by the release workflow).
publish:
  provider: github
  owner: l7v0l
  repo: drift-browser
  releaseType: release

name: Bug report | بلاغ خطأ
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? | ماذا حدث؟
      description: Steps to reproduce, and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Drift version | إصدار Drift
      description: Shown in drift://about
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system | نظام التشغيل
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
